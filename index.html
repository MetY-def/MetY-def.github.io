<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DJ FluffyPaw Nya</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet"/>

  <style>
    body {
      margin: 0;
      font-family: 'Rajdhani', sans-serif;
      background: #080a0f;
      color: #e0e8ff;
    }

    header {
      padding: 20px;
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid #222;
    }

    .nav-btn {
      margin-left: 10px;
      cursor: pointer;
    }

    .nav-btn.active {
      color: cyan;
    }

    .hero {
      text-align: center;
      padding: 40px;
    }

    .hero img {
      max-width: 600px;
      width: 100%;
    }

    .vrchat-grid {
      padding: 40px;
    }

    .about-wrap {
      display: flex;
      gap: 40px;
      padding: 40px;
    }

    .about-img-wrap {
      width: 250px;
    }

    .about-img {
      width: 100%;
    }

    @media(max-width:700px){
      .about-wrap {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>DJ FluffyPaw Nya</h1>
  <div>
    <button class="nav-btn active" onclick="showSection('home', this)">Home</button>
    <button class="nav-btn" onclick="showSection('musik', this)">Musik</button>
    <button class="nav-btn" onclick="showSection('vrchat', this)">VRChat-Welten</button>
    <button class="nav-btn" onclick="showSection('about', this)">Über Fluffy</button>
  </div>
</header>

<!-- HOME -->
<div id="section-home">
  <div class="hero">
    <img src="hero.png" onerror="this.style.display='none'">
  </div>
</div>

<!-- MUSIK -->
<div id="section-musik" style="display:none; padding:40px;">
  Musikbereich funktioniert ✔
</div>

<!-- VRCHAT -->
<div id="section-vrchat" style="display:none;">

  <div style="text-align:center; padding:40px;">
    <a href="https://vrc.group/ROCKBA.4999" target="_blank">
      <img src="rtb_banner.png"
           style="max-width:600px;width:100%;"
           onerror="this.style.display='none'; document.getElementById('fallback-banner').style.display='block';">
    </a>

    <div id="fallback-banner" style="display:none; color:gray; margin-top:20px;">
      [ Banner konnte nicht geladen werden ]
    </div>
  </div>

  <div class="vrchat-grid">

    <h3>Party Welten</h3>
    <div style="padding:20px; background:#111; text-align:center;">
      Coming Soon
    </div>

    <h3 style="margin-top:40px;">Cozy Welten</h3>
    <div style="padding:20px; background:#111; text-align:center;">
      Coming Soon
    </div>

  </div>

</div>

<!-- ABOUT -->
<div id="section-about" style="display:none;">

  <div class="about-wrap">

    <div class="about-img-wrap">
      <img src="about.png"
           class="about-img"
           onerror="this.style.display='none'; document.getElementById('fallback-about').style.display='block';">

      <div id="fallback-about" style="display:none; color:gray;">
        [ Bild konnte nicht geladen werden ]
      </div>
    </div>

    <div>
      <h2>DJ FluffyPaw Nya</h2>
      <p>Hey! Ich bin Marla, DJ und Gamerin.</p>
      <p>Ich bringe gute Stimmung in jedes Set.</p>
    </div>

  </div>

</div>

<script>
function showSection(id, btn) {
  document.getElementById('section-home').style.display = id === 'home' ? 'block' : 'none';
  document.getElementById('section-musik').style.display = id === 'musik' ? 'block' : 'none';
  document.getElementById('section-vrchat').style.display = id === 'vrchat' ? 'block' : 'none';
  document.getElementById('section-about').style.display = id === 'about' ? 'block' : 'none';

  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}
</script>

</body>
</html>
