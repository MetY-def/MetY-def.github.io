<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nyla – Gaming & Music</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Rajdhani', sans-serif; background: #080808; color: #f0f0f0; min-height: 100vh; overflow: hidden; }
    .landing { display: grid; grid-template-columns: 1fr 1fr; min-height: 100vh; position: relative; }
    .center-logo { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 10; display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .center-logo img { width: 130px; height: 130px; object-fit: contain; filter: drop-shadow(0 0 20px rgba(255,45,122,0.8)); animation: pulse 3s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{filter:drop-shadow(0 0 20px rgba(255,45,122,0.8));transform:scale(1);}50%{filter:drop-shadow(0 0 40px rgba(255,45,122,1));transform:scale(1.05);} }
    .center-tagline { font-family:'Orbitron',monospace; font-size:0.55rem; letter-spacing:0.3em; color:rgba(255,255,255,0.35); text-transform:uppercase; text-align:center; white-space:nowrap; }
    .side-gaming { position:relative; background:radial-gradient(ellipse at 30% 50%, rgba(0,80,255,0.12) 0%, #080808 70%); display:flex; flex-direction:column; align-items:flex-start; justify-content:center; padding:60px 80px; cursor:pointer; overflow:hidden; border-right:1px solid rgba(255,255,255,0.05); text-decoration:none; }
    .side-gaming::before { content:''; position:absolute; inset:0; background:radial-gradient(ellipse at 30% 50%, rgba(0,100,255,0.2) 0%, transparent 70%); opacity:0; transition:opacity 0.4s; }
    .side-gaming:hover::before { opacity:1; }
    .side-music { position:relative; background:radial-gradient(ellipse at 70% 50%, rgba(255,45,122,0.12) 0%, #080808 70%); display:flex; flex-direction:column; align-items:flex-end; justify-content:center; padding:60px 80px; cursor:pointer; overflow:hidden; text-decoration:none; }
    .side-music::before { content:''; position:absolute; inset:0; background:radial-gradient(ellipse at 70% 50%, rgba(255,45,122,0.2) 0%, transparent 70%); opacity:0; transition:opacity 0.4s; }
    .side-music:hover::before { opacity:1; }
    .side-gaming::after,.side-music::after { content:''; position:absolute; inset:0; background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(255,255,255,0.008) 3px,rgba(255,255,255,0.008) 4px); pointer-events:none; }
    .side-content { position:relative; z-index:1; }
    .side-channel { font-family:'Orbitron',monospace; font-size:0.55rem; letter-spacing:0.3em; color:rgba(255,255,255,0.3); text-transform:uppercase; margin-bottom:8px; display:flex; align-items:center; gap:8px; }
    .side-channel svg { width:14px; height:14px; }
    .side-title-gaming { font-family:'Orbitron',monospace; font-size:clamp(2.5rem,6vw,5rem); font-weight:900; letter-spacing:0.05em; line-height:1; color:#fff; text-shadow:0 0 40px rgba(0,100,255,0.6); margin-bottom:8px; }
    .side-title-music { font-family:'Orbitron',monospace; font-size:clamp(2.5rem,6vw,5rem); font-weight:900; letter-spacing:0.05em; line-height:1; color:#fff; text-shadow:0 0 40px rgba(255,45,122,0.8); margin-bottom:8px; text-align:right; }
    .side-sub { font-size:1rem; color:rgba(255,255,255,0.35); letter-spacing:0.1em; margin-bottom:32px; }
    .enter-btn { display:inline-flex; align-items:center; gap:10px; font-family:'Orbitron',monospace; font-size:0.7rem; letter-spacing:0.25em; text-transform:uppercase; padding:14px 32px; border-radius:6px; cursor:pointer; transition:all 0.2s; text-decoration:none; }
    .enter-gaming { background:rgba(0,100,255,0.12); border:1px solid rgba(0,100,255,0.35); color:#4d9fff; }
    .enter-gaming:hover { background:rgba(0,100,255,0.25); box-shadow:0 0 20px rgba(0,100,255,0.3); }
    .enter-music { background:rgba(255,45,122,0.12); border:1px solid rgba(255,45,122,0.35); color:#ff2d7a; }
    .enter-music:hover { background:rgba(255,45,122,0.25); box-shadow:0 0 20px rgba(255,45,122,0.3); }
    .divider-line { position:absolute; top:0; left:50%; width:1px; height:100%; background:linear-gradient(180deg,transparent 0%,rgba(255,45,122,0.25) 30%,rgba(255,45,122,0.5) 50%,rgba(255,45,122,0.25) 70%,transparent 100%); z-index:5; }
    .avatar-center { position:absolute; bottom:0; left:50%; transform:translateX(-50%); width:380px; z-index:8; pointer-events:none; }
    .avatar-center img { width:100%; object-fit:contain; filter:drop-shadow(0 0 30px rgba(255,45,122,0.35)); }
    .bottom-tagline { position:absolute; bottom:28px; left:50%; transform:translateX(-50%); font-family:'Orbitron',monospace; font-size:0.5rem; letter-spacing:0.4em; color:rgba(255,255,255,0.12); text-transform:uppercase; white-space:nowrap; z-index:10; }
    @media(max-width:768px){.landing{grid-template-columns:1fr;grid-template-rows:1fr 1fr;}.body{overflow:auto;}.side-gaming{align-items:center;padding:60px 32px;border-right:none;border-bottom:1px solid rgba(255,255,255,0.05);}.side-music{align-items:center;padding:60px 32px;}.side-title-music{text-align:center;}.center-logo,.divider-line,.avatar-center,.bottom-tagline{display:none;}}
  </style>
</head>
<body>
<div class="landing">

  <a href="gaming.html" class="side-gaming">
    <div class="side-content">
      <div class="side-channel">
        <svg viewBox="0 0 24 24" fill="#9146ff"><path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714z"/></svg>
        einfach_nyla
      </div>
      <div class="side-title-gaming">GAMING</div>
      <div class="side-sub">Just Play. Be Cozy.</div>
      <span class="enter-btn enter-gaming">Enter →</span>
    </div>
  </a>

  <a href="music.html" class="side-music">
    <div class="side-content" style="display:flex;flex-direction:column;align-items:flex-end;">
      <div class="side-channel" style="justify-content:flex-end;">
        DJ_Nyla
        <svg viewBox="0 0 24 24" fill="#9146ff"><path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714z"/></svg>
      </div>
      <div class="side-title-music">MUSIC</div>
      <div class="side-sub" style="text-align:right;">Dark Beats. Dirty Vibes.</div>
      <span class="enter-btn enter-music">Enter →</span>
    </div>
  </a>

  <div class="divider-line"></div>

  <div class="center-logo">
    <img src="logo.png" alt="Nyla">
    <div class="center-tagline">Which Side Today?</div>
  </div>

  <div class="avatar-center">
    <img src="about.png" alt="Nyla Avatar">
  </div>

  <div class="bottom-tagline">Play Hard · Feel the Beat</div>

</div>
</body>
</html>
